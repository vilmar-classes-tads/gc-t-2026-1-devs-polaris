name: Java CI com Maven e Docker
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e executar testes
        run: mvn clean package

      - name: Construir imagem Docker
        run: docker build -t sistema-editais:${{ github.sha }} .

      - name: Verificar imagem criada
        run: docker images
